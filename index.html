<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F7F1E1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110F" media="(prefers-color-scheme: dark)" />
    <title>CalCredit · Anna University Academic Marks &amp; Grade Calculator</title>
    <meta name="description" content="Calculate Continuous Assessment (CA) and End Semester Examination (ESE) marks, GPA, and CGPA for Anna University courses." />
    <meta property="og:title" content="CalCredit · Anna University Academic Marks &amp; Grade Calculator" />
    <meta property="og:description" content="Calculate Continuous Assessment (CA) and End Semester Examination (ESE) marks, GPA, and CGPA for Anna University courses." />
    <meta property="og:image" content="/favicon.svg" />
    <script>
      try {
        var savedTheme = localStorage.getItem('calcredit_theme') || 'light';
        document.documentElement.dataset.theme = savedTheme;
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="calcredit-ambient-bg" aria-hidden="true">
      <img class="wallpaper-layer light-bg" src="/warm-scholar-bg.png" alt="" width="682" height="1024" decoding="async" fetchpriority="high" />
      <img class="wallpaper-layer dark-bg" src="/dark-scholar-bg.png" alt="" width="682" height="1024" decoding="async" />
      <div class="breath-layer" aria-hidden="true"></div>
      <div class="spark-layer" aria-hidden="true">
        <i class="spark s1"></i>
        <i class="spark s2"></i>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
