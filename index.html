<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOS PWA Fullscreen & Native Feel -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CalCredit" />
    <meta name="theme-color" content="#F7F1E1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110F" media="(prefers-color-scheme: dark)" />
    <title>CalCredit · Anna University Academic Marks &amp; Grade Calculator</title>
    <meta name="description" content="Calculate Continuous Assessment (CA) and End Semester Examination (ESE) marks, GPA, and CGPA for Anna University courses." />
    <meta property="og:title" content="CalCredit · Anna University Academic Marks &amp; Grade Calculator" />
    <meta property="og:description" content="Calculate Continuous Assessment (CA) and End Semester Examination (ESE) marks, GPA, and CGPA for Anna University courses." />
    <meta property="og:image" content="/favicon.svg" />
    <script>
      try {
        var storedTheme = localStorage.getItem('calcredit_theme');
        var isDark = storedTheme === 'dark' || (!storedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var activeTheme = isDark ? 'dark' : 'light';
        document.documentElement.dataset.theme = activeTheme;
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        var launchPlayed = false;
        try {
          launchPlayed = sessionStorage.getItem('calcredit_launch_played') === 'true';
        } catch (e) {}
        if (!launchPlayed) {
          document.documentElement.classList.add('launch-pending');
        }
      } catch (e) {}
    </script>
    <style>
      /* Zero-flash launch critical style: matches LaunchAnimation background and suppresses ambient wallpaper */
      html.launch-pending,
      html.launch-pending body {
        background-color: #F7F1E1 !important;
        overflow: hidden !important;
      }
      html.launch-pending[data-theme="dark"],
      html.launch-pending[data-theme="dark"] body,
      html.launch-pending.dark,
      html.launch-pending.dark body {
        background-color: #14110F !important;
      }
      html.launch-pending #calcredit-ambient-bg {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
      html.launch-pending .launch-guarded-content {
        display: none !important;
        visibility: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="calcredit-ambient-bg" aria-hidden="true">
      <video
        class="wallpaper-video"
        aria-hidden="true"
        tabindex="-1"
        muted
        loop
        playsinline
        webkit-playsinline
        preload="auto"
        disablepictureinpicture
        disableremoteplayback
        controlslist="nodownload noplaybackrate noremoteplayback"
        poster="/warm-scholar-bg.png"
        data-light-src="/wallpaperdark.mp4/wallpaper_light_phone_1080x2400.mp4"
        data-dark-src="/wallpaperdark.mp4/CalCredit_Wallpaper_Dark_1080x1920.mp4"
      >
      </video>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
