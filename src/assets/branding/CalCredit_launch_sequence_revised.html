<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CalCredit launch sequence (revised)</title><style>
:root{--bg:#F7F4EC;--fg:#1B1815;--mu:#6B675E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0C0B;--fg:#F5EEDC;--mu:#A39E90}}
:root[data-theme="dark"]{--bg:#0E0C0B;--fg:#F5EEDC;--mu:#A39E90}
.st{--sbg:#FFFFFF;--word:#1B1815;--red:#E23B22;--yel:#F2A900;--ts:#E3DDCB}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .st{--sbg:#14110F;--word:#F5EEDC;--red:#F0482E;--yel:#FFD23F;--ts:#14110F}}
:root[data-theme="dark"] .st{--sbg:#14110F;--word:#F5EEDC;--red:#F0482E;--yel:#FFD23F;--ts:#14110F}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
.w{width:min(420px,100%)}
.st{display:block;margin:0 auto;height:min(72vh,640px);max-width:100%;aspect-ratio:9/16;border-radius:28px;background:var(--sbg);cursor:pointer}
.st .bg{fill:var(--sbg)}.st .r{fill:var(--red)}.st .wd{fill:var(--word)}.st .y{fill:var(--yel)}
.bar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;justify-content:center}
button{font:inherit;padding:8px 16px;border-radius:999px;border:1px solid var(--mu);background:transparent;color:var(--fg);cursor:pointer}
input{flex:1 1 100%;accent-color:#E23B22}.n{color:var(--mu);font-size:13px;margin:10px 2px 0;text-align:center}
</style></head><body><div class="w">
<svg class="st" id="st" viewBox="0 0 360 640" role="img" aria-label="CalCredit logo animation: grades gather, a pen writes the number 10 and circles it, then the name appears and a yellow dot lands on the i">

<g class="ch wd"><path d="M224.00 -24.90H230.20V-3.10H224.00Z"/><circle cx="227.10" cy="-24.90" r="3.10"/><circle cx="227.10" cy="-3.10" r="3.10"/></g>
<g class="ch wd"><path d="M244.50 -34.90H250.70V-9.50H244.50Z"/><circle cx="247.60" cy="-34.90" r="3.10"/><path d="M241.70 -28.00H253.50V-21.80H241.70Z"/><circle cx="241.70" cy="-24.90" r="3.10"/><circle cx="253.50" cy="-24.90" r="3.10"/><path d="M255.60 0.60A11.10 11.10 0 0 1 244.56 -11.66L250.73 -11.01A4.90 4.90 0 0 0 255.60 -5.60Z"/><circle cx="255.60" cy="-2.50" r="3.10"/></g>

</svg>
<div class="bar"><button id="r">Replay first launch</button><button id="q">Replay returning launch</button><button id="th">Switch theme</button><input id="sc" type="range" min="0" max="1000" value="0" aria-label="Scrub the first-launch timeline"></div>
<p class="n">First launch: 3.7 s. Returning launch: about 1.25 s, with the 10 already written. Tap the stage to glide to the end, or drag the slider to inspect any frame.</p></div>
<script>
const $=i=>document.getElementById(i),c=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),S=(t,a,b)=>c((t-a)/(b-a));
const io=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,out=u=>1-Math.pow(1-u,3),back=u=>1+2.7*Math.pow(u-1,3)+1.7*Math.pow(u-1,2);
const bnc=u=>{const n=7.5625,d=2.75;if(u<1/d)return n*u*u;if(u<2/d)return n*(u-=1.5/d)*u+.75;if(u<2.5/d)return n*(u-=2.25/d)*u+.9375;return n*(u-=2.625/d)*u+.984375};
/* Timeline (seconds): grades 0-.75 | tile .45-.75 | pen in .65-.8 | writes 1 .8-1.05, 0 1.05-1.4 | hop 1.4-1.5 | circle 1.5-2.1 | impact 2.1 | tile up 2.2-2.7 | name 2.35-3.15 | dot 2.85-3.3 | hold to 3.7 */
const T=3.7,QS=1.4,QJ=2.1,QA=.45,TQ=QA+(T-QJ)/2;
const ring=$('ring'),d1=$('d1'),d0=$('d0'),RL=ring.getTotalLength(),L1=d1.getTotalLength(),L0=d0.getTotalLength();
[[d1,L1],[d0,L0],[ring,RL]].forEach(([e,l])=>e.style.strokeDasharray=l+' '+l);
const dr=(e,l,p)=>{e.style.strokeDashoffset=l*(1-p);e.style.opacity=p>0?1:0};
const chs=[...document.querySelectorAll('.ch')],tile=$('tile'),pen=$('pen'),rip=$('rip'),dot=$('dot'),gr=$('gr');
const pt=(e,l,p)=>{const q=e.getPointAtLength(l*p);return{x:q.x,y:q.y}},O={x:-3.5,y:-2},sh=q=>({x:q.x+O.x,y:q.y+O.y});
function penAt(t){
 if(t<=.8)return sh(pt(d1,L1,0));
 if(t<=1.05)return sh(pt(d1,L1,io(S(t,.8,1.05))));
 if(t<=1.4)return sh(pt(d0,L0,io(S(t,1.05,1.4))));
 if(t<=1.5){const u=S(t,1.4,1.5),e=io(u),a=sh(pt(d0,L0,1)),b=pt(ring,RL,0);return{x:a.x+(b.x-a.x)*e,y:a.y+(b.y-a.y)*e-8*Math.sin(Math.PI*u)}}
 return pt(ring,RL,io(S(t,1.5,2.1)));
}
/* Grades gather: readable first, then they fade as they reach the tile */
const rnd=(s=>()=>(s=s*16807%2147483647)/2147483647)(7);
const GR=['O','A+','A','B+','10','9','8','3','4','A','10','O'].map(k=>{const g={k,a:rnd()*6.283,rx:80+rnd()*80,ry:130+rnd()*130,s:.85+rnd()*.5};
 g.e=document.createElementNS('http://www.w3.org/2000/svg','text');
 ['text-anchor:middle','dy:.35em','font-size:26','font-weight:700','font-family:system-ui,sans-serif'].forEach(p=>{const [n,v]=p.split(':');g.e.setAttribute(n,v)});
 g.e.setAttribute('style','fill:'+(k==='O'||k==='10'?'var(--yel)':k==='A+'||k==='B+'?'var(--red)':'var(--word)'));g.e.textContent=k;gr.appendChild(g.e);return g});
function R(t){
 const e=io(S(t,.05,.75)),fo=out(S(t,0,.15))*(1-S(t,.5,.75))*.9;
 GR.forEach(g=>{const an=g.a+1.2*e;g.e.setAttribute('transform',`translate(${180+g.rx*(1-e)*Math.cos(an)} ${320+g.ry*(1-e)*Math.sin(an)}) scale(${g.s*(1-.55*e)})`);g.e.style.opacity=fo});
 const m=io(S(t,2.2,2.7)),sc=(.6+.6*back(S(t,.45,.75))-.2*m)*(1+.05*Math.sin(Math.PI*S(t,2.1,2.6)));
 tile.setAttribute('transform',`translate(180 ${320-70*m}) scale(${sc}) translate(-60 -60)`);tile.style.opacity=out(S(t,.45,.6));
 dr(d1,L1,io(S(t,.8,1.05)));dr(d0,L0,io(S(t,1.05,1.4)));dr(ring,RL,io(S(t,1.5,2.1)));
 const a=out(S(t,.65,.8)),p=penAt(t),f=S(t,2.1,2.5),wob=(t>.8&&t<2.1?1.5*Math.sin(t*38):0)+(f>0&&f<1?(1-f)*Math.sin(f*Math.PI*3)*7:0);
 pen.setAttribute('transform',`translate(${p.x} ${p.y-14*(1-a)}) rotate(${35+wob})`);pen.style.opacity=a;
 const u=S(t,2.1,2.6);rip.setAttribute('r',4+28*out(u));rip.style.opacity=u>0&&u<1?(1-u)*.8:0;
 chs.forEach((el,i)=>{const q=S(t,2.35+.05*i,2.75+.05*i);el.setAttribute('transform',`translate(0 ${8*(1-out(q))})`);el.style.opacity=out(q)});
 const w=S(t,2.85,3.3);dot.setAttribute('transform',`translate(0 ${-70*(1-bnc(w))})`);dot.style.opacity=w>0?1:0;
}
let raf,cur=0;const sl=$('sc'),st=$('st');
const show=t=>{cur=t;R(t);sl.value=t/T*1000};
function run(map,len){cancelAnimationFrame(raf);const t0=performance.now();(function f(n){const u=(n-t0)/1000;if(u>=len){show(T);return}show(map(u));raf=requestAnimationFrame(f)})(t0)}
const qt=u=>u<QA?QS+u*(QJ-QS)/QA:QJ+(u-QA)*2;
function fade(){st.style.transition='none';st.style.opacity=0;void st.getBoundingClientRect();st.style.transition='opacity .2s';st.style.opacity=1}
$('r').onclick=()=>{st.style.opacity=1;run(u=>u,T)};
$('q').onclick=()=>{fade();run(qt,TQ)};
st.onclick=()=>{if(cur>=T)return;cancelAnimationFrame(raf);const from=cur,t0=performance.now();(function f(n){const u=c((n-t0)/280);show(from+(T-from)*out(u));if(u<1)raf=requestAnimationFrame(f)})(t0)};
sl.oninput=()=>{cancelAnimationFrame(raf);show(sl.value/1000*T)};
const dk=()=>document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches,th=$('th');
const lab=()=>th.textContent=dk()?'Switch to light':'Switch to dark';lab();
th.onclick=()=>{document.documentElement.dataset.theme=dk()?'light':'dark';lab()};
matchMedia('(prefers-reduced-motion: reduce)').matches?show(T):run(u=>u,T);
</script></body></html>
